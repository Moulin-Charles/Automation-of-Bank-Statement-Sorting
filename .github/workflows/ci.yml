name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
          # the tool is used on Windows: keep one runner honest about it
          - os: windows-latest
            python-version: '3.14'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: pytest -v

      - name: Extract the sample statement end to end
        run: python extract_releve.py tests/data/releve_exemple.pdf -o sample.xlsx

  no-real-data:
    name: no real statement in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Only the synthetic sample may be committed
        run: |
          intrus=$(git ls-files '*.pdf' '*.xlsx' | grep -v '^tests/data/releve_exemple\.pdf$' || true)
          if [ -n "$intrus" ]; then
            echo "::error::these files look like real data and must not be committed:"
            echo "$intrus"
            exit 1
          fi
          echo "OK: the only committed statement is the synthetic sample."

      - name: No account number outside the tests and the README
        run: |
          intrus=$(git ls-files -z \
            | xargs -0 grep -lE --binary-files=without-match \
                'BE[0-9]{2} ?[0-9]{4} ?[0-9]{4} ?[0-9]{4}' \
            | grep -vE '^(tests/|README\.md$)' || true)
          if [ -n "$intrus" ]; then
            echo "::error::an IBAN appears outside the sample and its tests:"
            echo "$intrus"
            exit 1
          fi
          echo "OK: no IBAN outside the synthetic sample."
